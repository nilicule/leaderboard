[project]
name = "leaderboard"
version = "0.1.0"
description = "Rank GitHub organisation members by contribution activity"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "beautifulsoup4>=4.13",
    "lxml>=5.3",
    "jinja2>=3.1",
]

[project.scripts]
leaderboard = "leaderboard.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leaderboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
